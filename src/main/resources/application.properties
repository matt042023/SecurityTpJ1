spring.application.name=demoSecurity
server.port=8086

# Configuration utilisateur unique via properties (désactivée car on utilise SecurityConfig)
# spring.security.user.name=matthieu
# spring.security.user.password=password123
# spring.security.user.roles=USER

# Configuration de logging pour Spring Security (utile pour débugger)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Configuration Thymeleaf (optionnel - pour le développement)
spring.thymeleaf.cache=false