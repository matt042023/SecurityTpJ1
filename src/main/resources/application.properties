spring.application.name=demoSecurity
server.port=8086

# Configuration H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.format-sql=true

# Configuration Thymeleaf pour le développement
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Désactiver Spring Security temporairement pour accéder à H2 Console
# (On peut aussi configurer SecurityConfig pour autoriser /h2-console/*)
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN